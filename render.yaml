services:
  # Python FastAPI Backend Service
  - type: web
    name: vericheck-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false

  # React Applicant Portal (Static Site)
  - type: static
    name: vericheck-applicant-portal
    rootDir: applicant-portal
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: vericheck-backend
          property: host

  # React Officer Scrutiny Console (Static Site)
  - type: static
    name: vericheck-officer-dashboard
    rootDir: officer-dashboard
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: vericheck-backend
          property: host
