version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vericheck-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - backend-storage:/app/storage
      - backend-db:/app

  applicant-portal:
    build:
      context: ./applicant-portal
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    container_name: vericheck-applicant-portal
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  officer-dashboard:
    build:
      context: ./officer-dashboard
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    container_name: vericheck-officer-dashboard
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  backend-storage:
  backend-db:
